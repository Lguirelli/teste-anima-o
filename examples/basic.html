<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exemplo mínimo WML</title><link rel="stylesheet" href="../lib/motion.css"><style>body{font:24px system-ui;padding:8vw;background:#f1f0e9;color:#232920}section{min-height:90vh}h1,h2{max-width:600px}button{font:inherit}</style><body><section><h1 data-motion="word-rise" data-trigger="load">Uma biblioteca para o seu próximo projeto.</h1><button class="wml-button" data-motion="cta-swap"><span class="wml-button-label">Explore</span><span class="wml-button-arrow" aria-hidden="true">→</span></button><p>Role para revelar o próximo título.</p></section><section><h2 data-motion="word-rise">Movimento no momento certo.</h2></section><script type="module">import {mount} from '../lib/motion.js';const manifest=await fetch('../manifest.json').then(r=>r.json());const cleanup=mount(document,manifest);addEventListener('pagehide',cleanup,{once:true});</script></body></html>
